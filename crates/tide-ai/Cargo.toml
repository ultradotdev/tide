[package]
name = "tide-ai"
description = "AI foundation for Tide: secrets, model registry, providers, chat state, and CLI adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
scrypt = "0.11"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tide-config = { path = "../tide-config" }
tide-core = { path = "../tide-core" }
tokio.workspace = true
tracing.workspace = true
zeroize = "1.8"
wait-timeout = "0.2"
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile.workspace = true
temp-env = "0.3"

[lints]
workspace = true
