[graph]
# The four release targets. Duplicate and license checks ignore other platforms.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

# Maintenance notices are triaged for the bundled syntax engine. No vulnerability
# advisories are waived. Revisit these exceptions when replacing/upgrading syntect.
[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is transitively required by syntect/two-face for bundled grammar data; Tide does not accept user-supplied bincode grammars" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust is transitively required by syntect; Tide uses the bundled syntax set and does not load workspace YAML grammar definitions" },
]

[licenses]
# Accepted dependency licenses. Tide's own crates are Apache-2.0.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# xtask is `publish = false` maintainer tooling.
ignore = true

[bans]
# New duplicate versions fail CI. Each skip below is a duplicate that exists in
# Cargo.lock today; remove its entry when the dependency dedupe collapses it.
multiple-versions = "deny"
wildcards = "allow"
skip = [
  # x509-cert (tokio-postgres-rustls) is still on the der 0.7 / const-oid 0.9 line.
  { crate = "const-oid@0.9.6", reason = "x509-cert uses const-oid 0.9" },
  # rand 0.8 (Tide crates) and rand 0.10 (tokio-postgres, postgres-protocol).
  { crate = "rand@0.8.8", reason = "rand 0.8/0.10 split" },
  { crate = "rand_core@0.6.4", reason = "rand 0.8/0.10 split" },
  { crate = "getrandom@0.2.17", reason = "rand 0.8/0.10 split" },
  # nix: portable-pty, alacritty_terminal and Tide each pin a different minor.
  { crate = "nix@0.28.0", reason = "portable-pty pins nix 0.28" },
  { crate = "cfg_aliases@0.1.1", reason = "required by nix 0.28" },
  # Syntax engine and grammar data.
  # Older majors still used by transitive dependencies.
  { crate = "base64@0.22.1", reason = "alacritty_terminal, postgres-protocol and reqwest use base64 0.22" },
  { crate = "fallible-iterator@0.2.0", reason = "postgres-protocol uses fallible-iterator 0.2" },
  { crate = "hashbrown@0.14.5", reason = "dashmap uses hashbrown 0.14" },
  { crate = "hashbrown@0.16.1", reason = "transitive hashbrown majors" },
  { crate = "signal-hook@0.3.18", reason = "crossterm uses signal-hook 0.3" },
  { crate = "syn@2.0.119", reason = "proc-macro dependencies on syn 2 and 3" },
  { crate = "thiserror@1.0.69", reason = "filedescriptor (portable-pty) uses thiserror 1" },
  { crate = "thiserror-impl@1.0.69", reason = "filedescriptor (portable-pty) uses thiserror 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
